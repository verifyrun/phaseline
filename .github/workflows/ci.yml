name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:property
      - name: Check the sealed report study and reader regressions
        run: python3 studies/producer-trace/check.py
      - name: Packaged types compile without @types/node
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/consumer/node_modules/@verifyrun/phaseline"
          tar -xzf "$RUNNER_TEMP"/verifyrun-phaseline-*.tgz --strip-components=1 -C "$RUNNER_TEMP/consumer/node_modules/@verifyrun/phaseline"
          cp tests/types.ts tests/tsconfig.json "$RUNNER_TEMP/consumer/"
          "$GITHUB_WORKSPACE/node_modules/.bin/tsc" -p "$RUNNER_TEMP/consumer/tsconfig.json"
  public-install:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Follow the published CLI and library instructions anonymously
        run: node tests/public-install.mjs
      - name: Probe a real change in a consuming project
        shell: bash
        run: |
          dest=$(mktemp -d)
          cp examples/configuration/*.py "$dest/"
          cd "$dest"
          npm install --ignore-scripts --no-audit --no-fund --save-exact @verifyrun/phaseline@0.4.1
          for version in 1.1.1 1.2.0; do
            if [ "$version" = 1.1.1 ]; then
              digest=31f23644fe2602f88ff55e1f5c79ba497e01224ee7737937930c448e4d0e24dc
            else
              digest=26010671bc0310b579dc981d8ae69047138bfdfc224df80211b196e5716150db
            fi
            echo "python-dotenv==$version --hash=sha256:$digest" > pinned.txt
            python -m pip install --quiet --only-binary=:all: --no-deps --require-hashes -r pinned.txt --target "$version"
            PYTHONPATH="$version" python check.py node node_modules/@verifyrun/phaseline/phase.mjs
          done
      - name: Replay the Markdown reporter's original fixture
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dest=$(mktemp -d)
          cp studies/markdown-receiver/{check.mjs,render.py,report.md} "$dest/"
          cd "$dest"
          npm install --ignore-scripts --no-audit --no-fund --save-exact @verifyrun/phaseline@0.5.0-rc.54
          for version in 9.11.0 9.12.0; do
            python -m pip install --quiet --only-binary=:all: --target "$version" "rich==$version" commonmark==0.9.2
            PYTHONPATH="$version" python render.py report.md > "$version.json"
          done
          node check.mjs node_modules/@verifyrun/phaseline/phase.mjs 9.11.0.json 9.12.0.json
