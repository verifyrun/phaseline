# Publishes to npm with build provenance when a version tag is pushed.
# Prerelease versions (with a hyphen) go to the "next" tag; others go to "latest".
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:property
      - name: Pack
        run: npm pack
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: verifyrun-phaseline-*.tgz
      - name: Signed GitHub release with the archive and its provenance
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "verifyrun-phaseline-${GITHUB_REF_NAME#v}.intoto.jsonl"
          case "$GITHUB_REF_NAME" in *-*) PRE=--prerelease ;; *) PRE= ;; esac
          gh release create "$GITHUB_REF_NAME" $PRE --verify-tag --notes-file CHANGELOG.md verifyrun-phaseline-*.tgz verifyrun-phaseline-*.intoto.jsonl
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          case "$GITHUB_REF_NAME" in *-*) TAG=next ;; *) TAG=latest ;; esac
          npm publish verifyrun-phaseline-*.tgz --provenance --access public --tag "$TAG"
