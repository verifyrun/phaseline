# Publishes to npm with build provenance when a version tag is pushed.
# Prerelease versions (with a hyphen) go to the "next" tag; others go to "latest".
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci --ignore-scripts
      - name: Pack and test the release archive
        run: |
          archive=$(npm pack --silent)
          sha256sum "$archive"
          bash scripts/test-package.sh "$archive"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ARCHIVE }}
      - name: Publish the verified archive and confirm registry integrity
        run: |
          spec="@verifyrun/phaseline@${GITHUB_REF_NAME#v}"
          integrity="sha512-$(openssl dgst -sha512 -binary "$ARCHIVE" | openssl base64 -A)"
          current=$(npm view "$spec" dist.integrity --prefer-online 2>/dev/null || true)
          if [ -n "$current" ] && [ "$current" != "$integrity" ]; then
            echo "The registry already contains different bytes for $spec" >&2
            exit 1
          fi
          if [ -z "$current" ]; then
            case "$GITHUB_REF_NAME" in *-*) TAG=next ;; *) TAG=latest ;; esac
            npx --yes npm@11.21.3 publish "$ARCHIVE" --provenance --access public --tag "$TAG"
          fi
          bash .github/scripts/confirm-published-archive.sh "$spec" "$integrity"
      - name: Attach the verified archive and attestation to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          proof="${ARCHIVE%.tgz}.intoto.jsonl"
          cp "$BUNDLE" "$proof"
          case "$GITHUB_REF_NAME" in *-*) PRE=--prerelease ;; *) PRE= ;; esac
          gh release create "$GITHUB_REF_NAME" $PRE --verify-tag --notes-file CHANGELOG.md "$ARCHIVE" "$proof"
